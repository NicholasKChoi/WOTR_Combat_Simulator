name: AoE4 data freshness

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare the English snapshot with upstream
        run: node data/aoe4-build-order/check-freshness.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
